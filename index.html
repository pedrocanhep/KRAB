<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/midia/logo-krab-png.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRAB</title>
    <script>
      // Aplicado antes dos estilos e do Vue para evitar flash do tema incorreto.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('krab.tema.v1') === 'light' ? 'light' : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
